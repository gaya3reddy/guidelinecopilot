steps:
  # Build API image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'Dockerfile.api', '-t', 'us-central1-docker.pkg.dev/guidelinecopilot/guidelinecopilot/api:latest', '.']

  # Build UI image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'Dockerfile.ui', '-t', 'us-central1-docker.pkg.dev/guidelinecopilot/guidelinecopilot/ui:latest', '.']

  # Push API image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/guidelinecopilot/guidelinecopilot/api:latest']

  # Push UI image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/guidelinecopilot/guidelinecopilot/ui:latest']

  # Deploy API to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gcloud'
      - 'run'
      - 'deploy'
      - 'guidelinecopilot-api'
      - '--image=us-central1-docker.pkg.dev/guidelinecopilot/guidelinecopilot/api:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest'
      - '--set-env-vars=DATA_DIR=/app/data,LOG_FORMAT=json'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--port=8000'
      - '--add-volume=name=chromadb-storage,type=cloud-storage,bucket=guidelinecopilot-chromadb'
      - '--add-volume-mount=volume=chromadb-storage,mount-path=/app/data'
      - '--project=guidelinecopilot'

  # Deploy UI to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gcloud'
      - 'run'
      - 'deploy'
      - 'guidelinecopilot-ui'
      - '--image=us-central1-docker.pkg.dev/guidelinecopilot/guidelinecopilot/ui:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=API_BASE=https://guidelinecopilot-api-920291374136.us-central1.run.app'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--port=8501'
      - '--project=guidelinecopilot'

images:
  - 'us-central1-docker.pkg.dev/guidelinecopilot/guidelinecopilot/api:latest'
  - 'us-central1-docker.pkg.dev/guidelinecopilot/guidelinecopilot/ui:latest'

logsBucket: 'gs://guidelinecopilot-chromadb/cloudbuild-logs'

options:
  logging: GCS_ONLY
