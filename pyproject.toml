[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guidelinecopilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "python-multipart",
  "requests",
  "streamlit",
  "python-dotenv",
  "pypdf",
  "chromadb",
  "sentence-transformers",
  "openai",
  "rank-bm25",
  "langgraph",
  "langchain-openai",
  "langchain-core",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "black",
  "pre-commit",
  # pinned: 0.2.15 is the last version compatible with this langchain stack
  # requires manual patch to remove VertexAI import from ragas/llms/base.py
  # see: eval/RAGAS_SETUP.md for instructions
  "ragas==0.2.15",
]

[tool.setuptools]
# IMPORTANT: stop setuptools from “discovering” data/eval/apps randomly
packages = { find = { include = ["apps.api*", "core*"], exclude = ["apps.ui*", "data*", "eval*", "tests*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff.lint]
# Pinned explicitly because "ruff" is an unpinned dev dependency — a fresh
# CI install grabs whatever version is current, and ruff has expanded its
# default rule selection over time. Without this, CI's lint step silently
# starts checking new rule categories (e.g. flake8-bugbear, pyupgrade,
# flake8-datetimez) whenever a new ruff release ships, which can fail CI
# on code that hasn't changed. E4/E7/E9/F is ruff's traditional
# conservative default (pycodestyle errors + pyflakes) and matches what
# this project's CI was implicitly relying on before this pin was added.
# Expand deliberately, not by accident of a `pip install` timing.
select = ["E4", "E7", "E9", "F"]