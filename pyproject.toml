[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guidelinecopilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "python-multipart",
  "requests",
  "streamlit",
  "python-dotenv",
  "pypdf",
  "chromadb",
  "sentence-transformers",
  "openai",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "black",
  "pre-commit",
  # pinned: 0.2.15 is the last version compatible with this langchain stack
  # requires manual patch to remove VertexAI import from ragas/llms/base.py
  # see: eval/RAGAS_SETUP.md for instructions
  "ragas==0.2.15",
]

[tool.setuptools]
# IMPORTANT: stop setuptools from “discovering” data/eval/apps randomly
packages = { find = { include = ["apps.api*", "core*"], exclude = ["apps.ui*", "data*", "eval*", "tests*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

